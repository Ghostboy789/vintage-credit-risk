name: 'vintage'
version: '1.0.0'
config-version: 2

profile: 'vintage'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Every origination/performance vintage year in the raw dataset. The "ci" target overrides
  # this to the four years the synthetic fixtures cover (see profiles.yml selector / --vars).
  vintage_years: [1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011,
                   2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  data_cutoff: '2026-03-01'

models:
  vintage:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
