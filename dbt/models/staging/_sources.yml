version: 2

# Raw Freddie Mac tables. "bq" resolves these against the real BigQuery `raw`
# dataset (loaded by scripts/load_bigquery.py) and ignores external_location, an
# unknown meta key to that adapter. "ci" and "local" are dbt-duckdb targets with no
# separate load step: external_location points each table straight at a Parquet
# file -- the synthetic fixture on "ci" (VINTAGE_CI_PARQUET_ROOT), the real
# extractor output under VINTAGE_DATA_ROOT/data/parquet on "local". Empty (and
# harmless) on any other target.
sources:
  - name: raw
    schema: raw
    tables:
      - name: orig_1999
        meta:
          external_location: "{% if target.name == 'ci' %}{{ env_var('VINTAGE_CI_PARQUET_ROOT', '') }}/orig_1999.parquet{% elif target.name == 'local' %}{{ env_var('VINTAGE_DATA_ROOT') }}/data/parquet/orig_1999.parquet{% else %}{% endif %}"
      - name: perf_1999
        meta:
          external_location: "{% if target.name == 'ci' %}{{ env_var('VINTAGE_CI_PARQUET_ROOT', '') }}/perf_1999.parquet{% elif target.name == 'local' %}{{ env_var('VINTAGE_DATA_ROOT') }}/data/parquet/perf_1999.parquet{% else %}{% endif %}"
