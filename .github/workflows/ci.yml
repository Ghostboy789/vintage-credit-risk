name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: ruff
        run: ruff check .

      - name: pytest (builds and tests the dbt project on the ci target, DuckDB + synthetic fixtures)
        run: pytest -q
        # Uses the repo's own dbt/profiles.yml (env-var only, no secrets) on its default "ci"
        # target. This project never touches BigQuery or real Freddie Mac data in CI: no gcloud
        # auth, no GCP project, no service-account key anywhere in this file.
